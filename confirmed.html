<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="confirmed.title">AutoSwipe AI — почта подтверждена</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css?v=3">
<style>
  .email { color: var(--text); font-weight: 600; word-break: break-all; }
</style>
</head>
<body class="sheet">
  <div class="panel center" id="card">
    <a class="logo" href="/"><img class="mark" src="/img/logo.png" alt="" width="26" height="26"> <span>AutoSwipe AI</span></a>

    <div class="mark" id="mark">✓</div>
    <h1 id="title" data-i18n="confirmed.okTitle">Почта подтверждена</h1>
    <p id="text" data-i18n="confirmed.okText">Аккаунт готов. Откройте расширение и войдите.</p>
    <p class="email" id="email"></p>

    <a class="btn block" id="cta" href="https://tinder.com/app/recs" data-i18n="confirmed.cta">Перейти в Tinder</a>

    <div class="steps" id="steps">
      <b data-i18n="confirmed.next">Что дальше</b>
      <ol>
        <li data-i18n="confirmed.s1">Нажмите иконку расширения в панели Chrome.</li>
        <li data-i18n="confirmed.s2">Введите ту же почту и пароль — теперь вход пройдёт.</li>
        <li data-i18n="confirmed.s3">Нажмите «Старт».</li>
      </ol>
    </div>

    <div style="margin-top:24px" data-lang></div>
  </div>

<script type="module">
/**
 * Supabase кладёт результат во фрагмент адреса: при успехе — токены сессии,
 * при просроченной ссылке — error/error_description.
 *
 * Токены отсюда сразу вычищаются: фрагмент иначе остаётся в истории браузера
 * и в заголовке вкладки, а это полноценные ключи от аккаунта.
 */
import { initI18n } from './i18n.js?v=4';

const params = new URLSearchParams(location.hash.slice(1));
const failed = params.has('error') || params.has('error_code');
const email = readEmail(params.get('access_token'));

// Стираем фрагмент с токенами, не оставляя записи в истории.
if (location.hash) history.replaceState(null, '', location.pathname + location.search);

const $ = (id) => document.getElementById(id);

if (failed) {
  // Класс `bad` перекрашивает кружок в красный — оформление карточки задаёт
  // общий site.css, поэтому базовые классы здесь сохраняем.
  $('card').className = 'panel center bad';
  $('mark').textContent = '!';
  $('steps').hidden = true;

  // Меняем не текст, а ключ перевода: тогда смена языка перерисует сообщение
  // об ошибке сама, а не вернёт заголовок «Почта подтверждена» на страницу,
  // где ничего не подтвердилось.
  $('title').dataset.i18n = 'confirmed.badTitle';
  $('text').dataset.i18n = 'confirmed.badText';

  // И вкладка тоже: «почта подтверждена» в её заголовке спорило бы с тем, что
  // человек читает на странице.
  document.querySelector('title').dataset.i18n = 'confirmed.badTitle';

  // Причину, если сервер её назвал, показываем как есть: она точнее общей
  // фразы, но переводить её нечем — это текст Supabase.
  const why = params.get('error_description');
  if (why) {
    delete $('text').dataset.i18n;
    $('text').textContent = why;
  }
} else if (email) {
  $('email').textContent = email;
}

await initI18n();

/** Достаёт почту из полезной нагрузки токена — только чтобы показать её. */
function readEmail(jwt) {
  try {
    const body = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(body)))).email || '';
  } catch {
    return '';
  }
}
</script>
</body>
</html>
