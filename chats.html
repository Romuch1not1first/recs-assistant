<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="chats.title">AutoSwipe AI — переписки</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css?v=6">
<style>
  /* Доска: пять колонок на широком экране, столбик на телефоне. Ширину держит
     minmax, а не медиазапросы — колонок ровно пять, и подбирать под них точки
     перелома значило бы описывать одно и то же пятью способами. */
  /* Панель на сайте узкая: она сделана под форму входа. Доске из пяти колонок
     этой ширины мало, и раздвигаем её здесь, а не в общем site.css — кроме
     этой страницы, широкая панель никому не нужна. */
  .panel.wide { max-width: 1180px; }

  .board {
    display: grid; gap: 16px; margin-top: 24px;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }

  .col { min-width: 0; }
  .col > h2 {
    font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .col > h2 b { color: var(--text-3); font-weight: 500; font-size: 13px; }

  /* Цветная полоска у заголовка: колонки различаются не порядком, а смыслом,
     и на телефоне, где они идут одна под другой, порядок не читается вовсе. */
  .col > h2::before {
    content: ''; width: 3px; height: 15px; border-radius: 2px; background: var(--dot);
  }
  .col.yours    { --dot: #0a84ff; }
  .col.waiting  { --dot: #34c759; }
  .col.unmatch  { --dot: #ff3b30; }
  .col.reengage { --dot: #ff9f0a; }
  .col.dead     { --dot: #8e8e93; }

  .chat {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .chat img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none; }
  .chat .who { min-width: 0; }
  .chat .name { font-size: 15px; font-weight: 600; }
  /* Не `.note`: так называется рамка-врезка в site.css, и карточка молча
     приезжала с чужими отступами в двадцать пикселей и рамкой вокруг слов
     «молчит 2 дн.». */
  .chat .mini { color: var(--text-3); font-size: 13px; margin-top: 2px; }

  /* Тег ошибки: короткое слово, по которому колонку и читают. */
  .tag {
    display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 20px;
    font-size: 12px; background: var(--line-soft); color: var(--text-2);
  }
  .tag.bad { background: #ff3b3018; color: #ff453a; }

  /* Карточка — кнопка: по нажатию разговор открывается на весь экран. Раньше
     он раскрывался прямо в карточке, в колонке шириной в двести пикселей и
     окошке в 360 px, — и читать его там было нельзя. */
  .chat { cursor: pointer; }
  .chat:hover { border-color: var(--line); }
  .chat .who { flex: 1; }

  /* Экран переписки: шапка, лента на всю высоту, подпись внизу. */
  .view {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    background: var(--bg);
  }
  .view[hidden] { display: none; }
  .view .head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft); background: var(--card);
    padding-top: max(12px, env(safe-area-inset-top));
  }
  .view .head img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .view .head .who { flex: 1; min-width: 0; }
  .view .head .name { font-size: 17px; font-weight: 600; }
  .view .head .mini { color: var(--text-3); font-size: 13px; margin-top: 2px; }
  .view .head .mini .tag { margin: 0 6px 0 0; vertical-align: middle; }
  .view .head a { color: var(--text-2); font-size: 14px; text-decoration: none; white-space: nowrap; }
  .view .head a:hover { color: var(--text); }
  .view .close {
    width: 36px; height: 36px; border-radius: 50%; border: 0; flex: none;
    background: var(--line-soft); color: var(--text); font-size: 18px; line-height: 1;
    cursor: pointer; font-family: inherit;
  }
  .view .close:hover { background: var(--line); }
  .view .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  /* Лента не шире газетной колонки: пузыри на всю ширину монитора не читаются. */
  .view .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .view .m {
    max-width: 72%; padding: 8px 12px; border-radius: 14px;
    font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .view .m.me { align-self: flex-end; background: #0a84ff; color: #fff; }
  .view .m.her { align-self: flex-start; background: var(--card); border: 1px solid var(--line-soft); color: var(--text); }
  .view .foot {
    padding: 10px 16px; border-top: 1px solid var(--line-soft);
    color: var(--text-3); font-size: 13px; text-align: center;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  body.viewing { overflow: hidden; }

  .sync { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0 0; }
  .sync .btn { width: auto; padding: 8px 14px; font-size: 14px; }
  .sync .mini { color: var(--text-3); font-size: 13px; }
  .sync .mini.err { color: #ff453a; }

  .empty { color: var(--text-3); font-size: 13px; padding: 4px 2px; }
  .sum { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; color: var(--text-2); font-size: 14px; }
  .sum b { color: var(--text); }
</style>
</head>
<body class="sheet">
  <div class="panel wide">
    <a class="logo" href="/"><img class="mark" src="/img/logo.png" alt="" width="26" height="26"> <span>AutoSwipe AI</span></a>

    <h1 data-i18n="chats.h1">Переписки</h1>
    <p id="lead" data-i18n="chats.lead">Что происходит в ваших чатах и почему кончаются те, что кончились.</p>

    <div class="msg" id="msg"></div>

    <!-- Сверка с Tinder сейчас — через расширение (site-bridge.js). Кнопка
         появляется, только когда расширение в этом браузере есть. -->
    <p class="sync" id="sync" hidden>
      <button class="btn" id="syncNow" data-i18n="chats.syncNow">Сверить с Tinder сейчас</button>
      <span class="mini" id="syncMsg"></span>
    </p>

    <!-- Сводка по тегам: ради неё классификатор и отдаёт теги, а не текст. -->
    <div class="sum" id="sum" hidden></div>

    <div class="board" id="board" hidden>
      <div class="col yours"><h2><span data-i18n="chats.yours">Ваш ход</span> <b id="nYours"></b></h2><div id="cYours"></div></div>
      <div class="col waiting"><h2><span data-i18n="chats.waiting">Ждут ответа</span> <b id="nWaiting"></b></h2><div id="cWaiting"></div></div>
      <div class="col unmatch"><h2><span data-i18n="chats.unmatched">Анмэтч</span> <b id="nUnmatched"></b></h2><div id="cUnmatched"></div></div>
      <div class="col reengage"><h2><span data-i18n="chats.reengage">Пора вернуться</span> <b id="nReengage"></b></h2><div id="cReengage"></div></div>
      <div class="col dead"><h2><span data-i18n="chats.dead">Мёртвые</span> <b id="nDead"></b></h2><div id="cDead"></div></div>
    </div>

    <div data-lang></div>
  </div>

  <!-- Экран переписки. Один на страницу: показывается поверх доски, пока
       открыт, и заполняется из карточки. -->
  <div class="view" id="view" hidden>
    <div class="head">
      <img id="vPhoto" alt="" hidden>
      <div class="who">
        <div class="name" id="vName"></div>
        <div class="mini" id="vMeta"></div>
      </div>
      <a id="vOpen" target="_blank" rel="noopener" data-i18n="chats.open">Открыть в Tinder</a>
      <button class="close" id="vClose" type="button" data-i18n-attr="title:chats.close, aria-label:chats.close">✕</button>
    </div>
    <div class="msgs" id="vMsgs"><div class="inner" id="vInner"></div></div>
    <div class="foot" id="vFoot"></div>
  </div>

<script type="module">
import { initI18n, t, whenLangChanges } from './i18n.js?v=19';
import { board, silentDays } from './chat-states.js?v=3';

const CONFIG = {
  supabaseUrl: 'https://scghlieavejohghkuozu.supabase.co',
  supabaseKey: 'sb_publishable_tVIZPhzT4ZS2vBG2cqjMkw_ea2BXSB3',
};

const SESSION_KEY = 'recs_session';
const $ = (id) => document.getElementById(id);

const readSession = () => {
  try {
    return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  } catch {
    return null;
  }
};

const writeSession = (s) => {
  if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else localStorage.removeItem(SESSION_KEY);
};

/** Ответ Supabase с токенами → то, что храним. Форма та же, что в кабинете. */
const toSession = (data) => ({
  access_token: data.access_token,
  refresh_token: data.refresh_token ?? null,
  // Запас в минуту: иначе токен мог истечь между проверкой и самим запросом.
  expires_at: Date.now() + ((Number(data.expires_in) || 3600) - 60) * 1000,
  user_id: data.user.id,
  email: data.user.email,
});

/**
 * Живой токен: истёкший обновляем по refresh-токену.
 *
 * Токен доступа живёт час. Кабинет это умеет с тех пор, как из-за просроченной
 * сессии молча переставали работать кнопки оплаты; дашборд не умел — и через
 * час после входа отвечал «не удалось загрузить», хотя грузить было что.
 *
 * Близнец этой функции живёт в account.html. Одна на двоих просится в общий
 * модуль вроде plans.js, но переносить её отсюда значит трогать оплату, а это
 * отдельная работа с отдельной проверкой.
 */
async function freshToken() {
  const s = readSession();
  if (!s) return null;
  if (s.expires_at && s.expires_at > Date.now()) return s.access_token;

  if (!s.refresh_token) {
    writeSession(null);
    return null;
  }

  try {
    const res = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: CONFIG.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    writeSession(toSession(data));
    return data.access_token;
  } catch {
    // Refresh-токен тоже недействителен — сессия закончилась.
    writeSession(null);
    return null;
  }
}

const say = (text, kind = '') => {
  const box = $('msg');
  box.textContent = text;
  box.className = `msg${kind ? ` ${kind}` : ''}`;
};

/**
 * Свои переписки из базы.
 *
 * Прямо в REST, без своей функции: строки читает сам пользователь своим
 * токеном, и отделяет его переписки от чужих RLS — та же защита, что у
 * подписки. Лишняя функция здесь только добавила бы места, где можно ошибиться.
 */
async function loadChats(token) {
  const res = await fetch(
    `${CONFIG.supabaseUrl}/rest/v1/chats` +
      '?select=match_id,name,photo,status,last_mine,last_at,messages,error_tag,short_reason,tail' +
      '&order=last_at.desc.nullslast&limit=500',
    {
      headers: {
        apikey: CONFIG.supabaseKey,
        Authorization: `Bearer ${token}`,
      },
    }
  );

  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

/** Досчитать причины у тех, кого расширение принесло, но разобрать не успело. */
async function classifyRest(token) {
  await fetch(`${CONFIG.supabaseUrl}/functions/v1/analyze-unmatch`, {
    method: 'POST',
    headers: {
      apikey: CONFIG.supabaseKey,
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
    },
    body: '{}',
  }).catch(() => {
    // Не вышло — доска всё равно покажет всё, что уже разобрано.
  });
}

/**
 * Подписи тегов.
 *
 * Списком, а не сборкой ключа из тега: собранный ключ не найти поиском по
 * файлу, и `check-lang` считает такую строку неиспользуемой — справедливо, ведь
 * опечатку в ней тоже никто не заметит.
 */
const TAG_KEY = {
  too_needy: 'chats.tag.too_needy',
  boring_interview: 'chats.tag.boring_interview',
  creepy: 'chats.tag.creepy',
  logical_fail: 'chats.tag.logical_fail',
  no_mistake: 'chats.tag.no_mistake',
};

/** Карточка переписки. */
function card(chat) {
  const box = document.createElement('div');
  box.className = 'chat';

  if (chat.photo) {
    const img = document.createElement('img');
    img.src = chat.photo;
    img.alt = '';
    img.loading = 'lazy';
    box.append(img);
  }

  const who = document.createElement('div');
  who.className = 'who';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = chat.name || '—';
  who.append(name);

  const days = silentDays(chat);
  if (days !== null) {
    const note = document.createElement('div');
    note.className = 'mini';
    note.textContent = days === 0 ? t('chats.today') : t('chats.days', { n: days });
    who.append(note);
  }

  // Карточка анмэтча выглядит как любая другая: имя и сколько молчит. Тег,
  // причина и две последние реплики раньше стояли прямо здесь — колонка
  // становилась в три раза выше остальных и читалась как стена текста. Всё это
  // осталось в экране переписки: нажатие на карточку показывает тег с причиной
  // в шапке и сам разговор. Сводка по тегам над доской тоже на месте.
  box.append(who);
  box.addEventListener('click', () => openView(chat));
  return box;
}

/**
 * Переписка — из расширения, а не с сервера.
 *
 * На сервере лежит только состояние: кто ждёт ответа, кто пропал. Сами
 * реплики хранит расширение у себя, и страница спрашивает их через мост
 * (src/site-bridge.js) в этом же браузере — на сервер они не уезжают. Нет
 * моста — значит расширения в этом браузере нет, и показать нечего, кроме
 * пары реплик, по которым поставлен тег анмэтча.
 */
let bridge = false;
const waiting = new Map();

window.addEventListener('message', (e) => {
  if (e.source !== window || e.origin !== location.origin) return;
  const msg = e.data;

  if (msg?.type === 'autoswipe:here') {
    bridge = true;
    $('sync').hidden = false;
  }
  if (msg?.type === 'autoswipe:sweep-done') sweepDone?.(msg.sweep ?? null);
  if (msg?.type === 'autoswipe:chat-log') {
    waiting.get(String(msg.id))?.(Array.isArray(msg.rows) ? msg.rows : []);
    waiting.delete(String(msg.id));
  }
});

/** Ждёт итог сверки, которую попросили у расширения. */
let sweepDone = null;

/**
 * Сверить список мэтчей с Tinder прямо сейчас — и перечитать доску.
 *
 * Делает это расширение (оно одно знает токен Tinder), страница только просит
 * и показывает, чем кончилось: сколько мэтчей, сколько анмэтчей нашлось, или
 * почему не вышло. Раньше об этом можно было узнать только из popup.
 */
async function syncNow() {
  const btn = $('syncNow');
  const out = $('syncMsg');
  btn.disabled = true;
  out.className = 'mini';
  out.textContent = t('chats.syncing');

  const sweep = await new Promise((done) => {
    sweepDone = done;
    window.postMessage({ type: 'autoswipe:sweep' }, location.origin);
    // Списки у активного человека большие, читаются постранично — даём минуту.
    setTimeout(() => { if (sweepDone === done) done(null); }, 60000);
  });
  sweepDone = null;

  if (!sweep) {
    out.className = 'mini err';
    out.textContent = t('chats.syncFail', { why: t('chats.syncSilent') });
  } else if (sweep.ok) {
    out.textContent = t('chats.syncOk', { n: sweep.chats ?? 0, gone: sweep.gone ?? 0 });
  } else {
    const why = sweep.why === 'no_token' || /Tinder HTTP 401/.test(String(sweep.why))
      ? t('chats.syncNoToken')
      : sweep.why === 'not_signed_in' ? t('chats.syncNotSignedIn') : String(sweep.why ?? '');
    out.className = 'mini err';
    out.textContent = t('chats.syncFail', { why });
  }
  btn.disabled = false;

  // Доску перечитываем в любом случае: даже неудачная сверка могла успеть
  // сохранить то, что нашла в прошлый раз.
  try {
    const token = await freshToken();
    if (token) {
      shown = await loadChats(token);
      render(shown);
    }
  } catch {
    // Осталась прежняя доска — и она не хуже пустой.
  }
}

$('syncNow').addEventListener('click', syncNow);

/** Реплики этой переписки из расширения — или пусто, если его нет. */
function askLog(id) {
  if (!bridge) return Promise.resolve(null);

  return new Promise((done) => {
    waiting.set(String(id), done);
    window.postMessage({ type: 'autoswipe:chat', id: String(id) }, location.origin);
    // Мост молчит — расширение перезагружалось. Не висим.
    setTimeout(() => { if (waiting.delete(String(id))) done([]); }, 3000);
  });
}

/** Какая переписка открыта сейчас: ответ моста на другую — уже не про нас. */
let viewing = null;

/**
 * Переписка на весь экран: шапка с именем и тегом, лента пузырями на всю
 * высоту, ссылка в сам Tinder.
 *
 * Что показать, решается по источнику: пришло из расширения — всё, что оно
 * сохранило; расширения нет — хвост с сервера, если он есть (только у
 * анмэтчей); нет и его — говорим, откуда переписка берётся.
 *
 * Открытие — запись в истории: кнопка «назад» (и жест на телефоне) закрывает
 * экран, а не уводит со страницы.
 */
async function openView(chat) {
  viewing = chat;

  $('vPhoto').hidden = !chat.photo;
  if (chat.photo) $('vPhoto').src = chat.photo;
  $('vName').textContent = chat.name || '—';

  // Под именем — то же, что на карточке: тег с причиной, молчание, статус.
  const meta = $('vMeta');
  meta.replaceChildren();
  if (chat.error_tag) {
    const tag = document.createElement('span');
    tag.className = `tag${chat.error_tag === 'no_mistake' ? '' : ' bad'}`;
    tag.textContent = t(TAG_KEY[chat.error_tag] ?? chat.error_tag);
    meta.append(tag);
    if (chat.short_reason) meta.append(chat.short_reason);
  } else if (chat.status === 'unmatched') {
    meta.textContent = t(chat.messages ? 'chats.tagWait' : 'chats.noChat');
  } else {
    const days = silentDays(chat);
    if (days !== null) meta.textContent = days === 0 ? t('chats.today') : t('chats.days', { n: days });
  }

  $('vOpen').href = `https://tinder.com/app/messages/${encodeURIComponent(chat.match_id)}`;
  $('vInner').replaceChildren();
  $('vFoot').textContent = t('chats.loadingChat');

  if (!history.state?.view) history.pushState({ view: true }, '');
  $('view').hidden = false;
  document.body.classList.add('viewing');

  const rows = (await askLog(chat.match_id)) ?? (Array.isArray(chat.tail) ? chat.tail : []);
  if (viewing !== chat) return; // пока грузили, открыли другую или закрыли

  const inner = $('vInner');
  for (const said of rows) {
    const m = document.createElement('div');
    m.className = `m ${said?.mine ? 'me' : 'her'}`;
    m.textContent = String(said?.text ?? '');
    inner.append(m);
  }
  $('vFoot').textContent = rows.length
    ? t('chats.rows', { n: rows.length })
    : t(bridge ? 'chats.noLog' : 'chats.noBridge');

  const msgs = $('vMsgs');
  msgs.scrollTop = msgs.scrollHeight;
}

function closeView() {
  viewing = null;
  $('view').hidden = true;
  document.body.classList.remove('viewing');
}

$('vClose').addEventListener('click', () => {
  // Через историю, чтобы «назад» потом не открыл экран заново.
  if (history.state?.view) history.back();
  else closeView();
});
window.addEventListener('popstate', () => {
  if (!history.state?.view) closeView();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && viewing) $('vClose').click();
});

/** Раскладывает доску. */
function render(chats) {
  const cols = board(chats);

  for (const [key, id] of [
    ['yours', 'Yours'],
    ['waiting', 'Waiting'],
    ['unmatched', 'Unmatched'],
    ['reengage', 'Reengage'],
    ['dead', 'Dead'],
  ]) {
    const list = cols[key];
    $(`n${id}`).textContent = list.length || '';

    const box = $(`c${id}`);
    box.replaceChildren(...list.map(card));

    if (!list.length) {
      const none = document.createElement('div');
      none.className = 'empty';
      none.textContent = t('chats.none');
      box.append(none);
    }
  }

  // Сводка по тегам: девять «too_needy» за месяц — это уже вывод, а карточки
  // по одной такого не показывают.
  const tags = {};
  for (const c of cols.unmatched) if (c.error_tag) tags[c.error_tag] = (tags[c.error_tag] ?? 0) + 1;

  const sum = Object.entries(tags).sort((a, b) => b[1] - a[1]);
  $('sum').hidden = !sum.length;
  $('sum').replaceChildren(
    ...sum.map(([tag, n]) => {
      const one = document.createElement('span');
      one.textContent = t(TAG_KEY[tag] ?? tag);

      const count = document.createElement('b');
      count.textContent = ` ${n}`;
      one.append(count);
      return one;
    })
  );

  $('board').hidden = false;
}

/** Что показано сейчас: чтобы перерисовать при смене языка, не ходя в сеть. */
let shown = [];

whenLangChanges(() => {
  if (shown.length) render(shown);
});

await initI18n();

(async () => {
  const token = await freshToken();
  if (!token) {
    say(t('chats.needSignIn'), 'err');
    return;
  }

  say(t('chats.loading'));

  try {
    let chats = await loadChats(token);

    // Есть неразобранные — просим разобрать и перечитываем. Один лишний запрос
    // раз в неделю дешевле, чем колонка с пустыми причинами.
    if (chats.some((c) => c.status === 'unmatched' && !c.error_tag)) {
      await classifyRest(token);
      chats = await loadChats(token);
    }

    say('');

    if (!chats.length) {
      say(t('chats.emptyAll'));
      return;
    }

    shown = chats;
    render(chats);
  } catch {
    say(t('chats.errLoad'), 'err');
  }
})();
</script>
