<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="share.titleTab">AutoSwipe AI — переписка</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css?v=6">
<style>
  /*
   * Переписка по ссылке — как экран переписки на странице «Переписки»: шапка с
   * именем, лента пузырями, полоса там, где разговор переехал на другую
   * площадку. Без входа и без расширения: всё приходит с сервера (share-chat).
   */
  .share { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  .share .head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft); background: var(--card);
    padding-top: max(12px, env(safe-area-inset-top));
  }
  .share .head .logo { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 600; }
  .share .head .who { flex: 1; min-width: 0; }
  .share .head .name { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share .head .mini { color: var(--text-3); font-size: 13px; margin-top: 2px; }
  .share .msgs { flex: 1; padding: 16px; }
  .share .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .share .m {
    max-width: 72%; padding: 8px 12px; border-radius: 14px;
    font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .share .m.me { align-self: flex-end; background: #0a84ff; color: #fff; }
  .share .m.her { align-self: flex-start; background: var(--card); border: 1px solid var(--line-soft); color: var(--text); }
  .share .switch {
    align-self: stretch; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px;
    margin: 14px 0 8px; padding: 8px 12px; border-radius: 12px;
    background: color-mix(in srgb, #0a84ff 12%, transparent); border: 1px dashed color-mix(in srgb, #0a84ff 45%, transparent);
    color: var(--text-2); font-size: 13px; font-weight: 600; text-align: center;
  }
  .share .day { align-self: center; color: var(--text-3); font-size: 12px; margin: 10px 0 2px; }
  .share .state { text-align: center; color: var(--text-3); padding: 48px 16px; font-size: 15px; }
  .share .foot {
    padding: 12px 16px; border-top: 1px solid var(--line-soft); color: var(--text-3);
    font-size: 13px; text-align: center; padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .share .foot a { color: #0a84ff; text-decoration: none; }
  .share .foot a:hover { text-decoration: underline; }
  .share [data-lang] { margin-top: 8px; display: flex; justify-content: center; }
</style>
</head>
<body>
  <div class="share">
    <div class="head">
      <a class="logo" href="/"><img class="mark" src="/img/logo.png" alt="" width="26" height="26"></a>
      <div class="who">
        <div class="name" id="name" data-i18n="share.titleTab">Переписка</div>
        <div class="mini" id="meta"></div>
      </div>
    </div>
    <div class="msgs"><div class="inner" id="inner"><div class="state" id="state" data-i18n="share.loading">Загружаю переписку…</div></div></div>
    <div class="foot">
      <span id="expires"></span>
      <div><span data-i18n="share.made">Поделились через</span> <a href="/">AutoSwipe AI</a></div>
      <div data-lang></div>
    </div>
  </div>

<script type="module">
import { initI18n, lang, t, whenLangChanges } from './i18n.js?v=21';

const SHARE_URL = 'https://scghlieavejohghkuozu.supabase.co/functions/v1/share-chat';
const SITE_NAMES = { tinder: 'Tinder', telegram: 'Telegram', instagram: 'Instagram' };
const siteName = (id) => SITE_NAMES[id] ?? id;
const $ = (id) => document.getElementById(id);

let data = null;
let failed = false;

const day = (at) =>
  new Date(at).toLocaleDateString(lang(), { day: 'numeric', month: 'long', year: 'numeric' });

function bubble(r) {
  const m = document.createElement('div');
  m.className = `m ${r.mine ? 'me' : 'her'}`;
  m.textContent = String(r.text ?? '');
  return m;
}

/** Реплики одного отрезка — с датой там, где начинается новый день. */
function segment(rows, last) {
  const out = [];
  for (const r of rows) {
    if (r.at) {
      const d = new Date(r.at).toDateString();
      if (d !== last.day) {
        last.day = d;
        const mark = document.createElement('div');
        mark.className = 'day';
        mark.textContent = day(r.at);
        out.push(mark);
      }
    }
    out.push(bubble(r));
  }
  return out;
}

function paint() {
  const inner = $('inner');
  if (failed || !data) {
    if (failed) {
      inner.replaceChildren(Object.assign(document.createElement('div'), { className: 'state', textContent: t('share.gone') }));
    }
    return;
  }

  $('name').textContent = data.name ? t('share.title', { name: data.name }) : t('share.titleTab');
  $('meta').textContent = t('share.from', { app: siteName(data.site || 'tinder') });
  document.title = `${$('name').textContent} — AutoSwipe AI`;

  const last = { day: '' };
  const items = segment(data.rows ?? [], last);
  for (const part of data.continued ?? []) {
    const line = document.createElement('div');
    line.className = 'switch';
    // Дата — строкой ниже, у первой реплики.
    line.textContent = t('chats.movedTo', { app: siteName(part.site) });
    items.push(line, ...segment(part.rows ?? [], last));
  }
  inner.replaceChildren(...items);
  $('expires').textContent = data.expires_at ? t('share.expires', { date: day(data.expires_at) }) : '';
}

whenLangChanges(paint);
await initI18n();

const id = new URLSearchParams(location.search).get('id') ?? '';
try {
  const res = await fetch(`${SHARE_URL}?id=${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  data = await res.json();
} catch {
  failed = true;
}
paint();
</script>
</body>
</html>
